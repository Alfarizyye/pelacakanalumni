<!DOCTYPE html>
<html>

<head>

<title>Riwayat Pelacakan Alumni</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

<h4>Alumni Tracker</h4>

<a href="dashboard.html">Dashboard</a>
<a href="history.html">History</a>
<a href="data_alumni.html">Data Alumni</a>

</div>

<div class="content">

<h2>Riwayat Pelacakan Alumni</h2>

<table class="table table-bordered">

<tr>
<th>Nama</th>
<th>Status</th>
<th>Confidence</th>
<th>Tanggal</th>
</tr>

<tbody id="historyTable"></tbody>

</table>

<a href="dashboard.html" class="btn btn-danger">
Kembali ke Dashboard
</a>

</div>

<script>

let historyData = [];

async function fetchHistory() {
    try {
        const response = await fetch('api/get_history.php');
        const result = await response.json();
        if (result.status === 'success') {
            historyData = result.data;
            tampilHistory();
        }
    } catch (e) {
        console.error("Gagal mengambil history", e);
    }
}

function tampilHistory() {
    let html = "";
    if (historyData.length === 0) {
        html = "<tr><td colspan='4' class='text-center'>Belum ada riwayat pelacakan.</td></tr>";
    } else {
        historyData.forEach(h => {
            html += `
            <tr>
                <td>${h.name}</td>
                <td>${h.status}</td>
                <td>
                    <div class="progress">
                        <div class="progress-bar bg-danger" style="width:${h.score}%">
                            ${h.score}%
                        </div>
                    </div>
                </td>
                <td>${h.tanggal}</td>
            </tr>
            `;
        });
    }
    document.getElementById("historyTable").innerHTML = html;
}

fetchHistory();

</script>

</body>
</html>
